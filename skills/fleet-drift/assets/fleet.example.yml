# fleet.yml for tmdl-drift-doctor. All paths are relative to this file.
# Every key below is read by the pinned v1.2.1 tag (`drift-doctor fleet
# check` validates the file). See references/drift-kinds.md.
version: 1
template: template/Product.SemanticModel
models:
  client-a: clients/client-a/Product.SemanticModel
  client-b:                                   # long form
    path: clients/client-b/Product.SemanticModel
    gating: advisory                          # findings print, never fail CI
    overrides:                                # declared, reviewed differences
      - object: Sales Measures[Net Revenue]
        kind: expression                      # expression | absent | retain
        reason: client-b nets out partner rebates by contract
        owner: bi-team
        added: 2026-10-01

mapping_tables: []        # lookup tables whose DATATABLE rows are diffed row by row

state_dir: .drift-doctor  # baseline.json, ledger.jsonl, floors.json: commit all three

allowlist:                # empty allowlist = nothing is ever remediated
  kinds:
    - measure.missing
    - measure.expression_drift
    - measure.property_drift
    - column.missing
    - relationship.missing
    # add after the first reviewed run:
    # - table.missing
    # - column.property_drift
    # - measure.wrong_host
    # - relationship.modified
    # - retire.measure     # deletions; still need --sync at run time
  expressions: []         # ONLY named shared parameters are compared; never connection parameters

# --- the keys that need the next tag -----------------------------------------

source_identity:          # how a table's source view is read; without it, source drift is off
  function: Source
  db_parameter: Database

incremental_refresh:      # the fact tables that must refresh like the template
  enabled: true
  fact_pattern: "^Visits$"
  exempt: []

fieldparam:
  families:               # the numbered axis levels and the variant tables
    - prefixes: ["x-Selector", "x-Plot Specific"]
      role: metric
    - prefixes: ["y-Selector", "y-Plot Specific"]
      role: dimension
  placeholder_table: "#Report Measures"

purge:                    # the pristine-category purge; off by default
  enabled: false
  infrastructure_fraction: 0.5

renames:                  # the reviewed rename map
  measures: {}
  columns: {}

overlays:                 # per-model policy, dq and mapping files
  dir: overlays
