<text x="76" y="100" fill="#f4f7fb" font-family="Inter,Arial,sans-serif" font-size="48" font-weight="700">Power BI Copilot: what changes in Jan 2027</text>
<text x="78" y="145" fill="#a9b9ce" font-family="Inter,Arial,sans-serif" font-size="23">Microsoft's November 2026 update distinguishes three experiences.</text>
<g font-family="Inter,Arial,sans-serif">
   <line x1="150" y1="340" x2="1050" y2="340" stroke="#49617f" stroke-width="5"/>
   <circle cx="230" cy="340" r="15" fill="#f3c46b"/>
   <circle cx="620" cy="340" r="15" fill="#f28b82"/>
   <circle cx="1010" cy="340" r="15" fill="#69d6c4"/>
