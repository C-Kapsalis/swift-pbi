<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">A DAX comment must not swallow RETURN</title>
<desc id="desc">Illustrative DAX expression from the swift-pbi metric-contract test. The comment on the DISTINCTCOUNT line is followed by a separate RETURN line and DIVIDE expression. The Markdown export preserves the line breaks so the comment does not hide the rest of the measure.</desc>
<rect width="1200" height="675" fill="#f5f3ed"/>
<rect x="0" y="0" width="14" height="675" fill="#245a57"/>
<text x="70" y="62" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2.5" fill="#9a6b2f">FIELD NOTE  /  19 NOV 2026</text>
<text x="70" y="119" font-family="Inter,Arial,sans-serif" font-size="39" font-weight="750" fill="#1c2a33">A DAX comment must not swallow RETURN</text>
<text x="70" y="157" font-family="Inter,Arial,sans-serif" font-size="19" fill="#52616a">swift-pbi tests that measure lines survive Markdown export.</text>
<line x1="70" y1="184" x2="1130" y2="184" stroke="#d5dbd6" stroke-width="2"/>
<rect x="70" y="220" width="650" height="300" rx="18" fill="#ffffff" stroke="#d9dfda" stroke-width="2"/>
<text x="105" y="265" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="1.5" fill="#245a57">ILLUSTRATIVE DAX FRAGMENT</text>
<rect x="100" y="290" width="590" height="190" rx="12" fill="#f0f2ee"/>
<text x="125" y="330" font-family="SFMono-Regular,Consolas,monospace" font-size="19" fill="#1c2a33">VAR store_count =</text>
<text x="125" y="370" font-family="SFMono-Regular,Consolas,monospace" font-size="19" fill="#1c2a33">    DISTINCTCOUNT(Sales[store_id])</text>
<text x="495" y="370" font-family="SFMono-Regular,Consolas,monospace" font-size="16" fill="#9a6b2f">-- stores that sold</text>
<rect x="112" y="391" width="565" height="42" rx="8" fill="#e4eeea"/>
<text x="125" y="420" font-family="SFMono-Regular,Consolas,monospace" font-size="20" font-weight="700" fill="#245a57">RETURN</text>
<text x="125" y="458" font-family="SFMono-Regular,Consolas,monospace" font-size="19" fill="#1c2a33">    DIVIDE([Revenue], store_count)</text>
<rect x="760" y="220" width="370" height="300" rx="18" fill="#ffffff" stroke="#d9dfda" stroke-width="2"/>
<text x="795" y="265" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="1.5" fill="#9a6b2f">WHY THE EXPORT TEST MATTERS</text>
<text x="795" y="330" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="700" fill="#1c2a33">Keep the lines</text>
<text x="795" y="371" font-family="Inter,Arial,sans-serif" font-size="19" fill="#52616a">The comment ends on its</text>
<text x="795" y="400" font-family="Inter,Arial,sans-serif" font-size="19" fill="#52616a">own line. RETURN stays</text>
<text x="795" y="429" font-family="Inter,Arial,sans-serif" font-size="19" fill="#52616a">visible to the reviewer.</text>
<line x1="795" y1="458" x2="1090" y2="458" stroke="#e2e5df" stroke-width="2"/>
<text x="795" y="491" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#245a57">MODEL LOGIC REMAINS VISIBLE</text>
<text x="70" y="574" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700" fill="#1c2a33">A readable contract should preserve the expression that the model actually contains.</text>
<text x="70" y="625" font-family="Inter,Arial,sans-serif" font-size="14" fill="#738078">Independent technical and product reporting · Source: swift-pbi metric-contract test</text>
</svg>