<text x="64" y="145" fill="#14283F" font-family="Arial, sans-serif" font-size="46" font-weight="700">A measure rename can break a chart's style.</text>
<text x="64" y="188" fill="#526273" font-family="Arial, sans-serif" font-size="24">The colour mapping lives in the visual, keyed by measure name.</text>
