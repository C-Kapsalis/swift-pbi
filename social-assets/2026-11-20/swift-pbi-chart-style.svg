<text x="432" y="350" fill="#14283F" font-family="Arial, sans-serif" font-size="27" font-weight="700">Series colour</text>
<text x="432" y="383" fill="#14283F" font-family="Arial, sans-serif" font-size="27" font-weight="700">keyed by name</text>
