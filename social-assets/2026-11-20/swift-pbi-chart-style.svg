<title id="title">Why a measure rename can break a Power BI chart style</title>
<desc id="desc">The semantic model contains a measure name, while each combo chart visual stores its series colour keyed by that name. Renaming the measure can leave a stale style reference. The swift-pbi chart-style workflow checks the report and restyles combo charts from field-parameter tables.</desc>
