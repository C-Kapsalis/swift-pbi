<rect x="76" y="474" width="1048" height="112" rx="16" fill="#EAF0F6"/>
<text x="108" y="514" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1E2B3A">Engineering handoff</text>
<text x="108" y="550" font-family="Arial, sans-serif" font-size="19" fill="#526273">Diagram · data dictionary · measures · validation summaries · open questions</text>
<text x="108" y="576" font-family="Arial, sans-serif" font-size="16" fill="#647384">Opening the PBIP in Power BI Desktop remains a separate manual step.</text>
<text x="76" y="651" font-family="Arial, sans-serif" font-size="15" fill="#82909D">Fictional sample rows are labelled as such; source systems and refresh rules remain engineering questions.</text>
