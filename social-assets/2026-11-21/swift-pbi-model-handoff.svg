  <text x="355" y="376" text-anchor="middle" font-size="21" font-weight="700" fill="#1E2B3A">dates, measures</text>
  <path d="M446 337 H479" stroke="#8A98A6" stroke-width="3" fill="none"/><path d="M468 326 L479 337 L468 348" stroke="#8A98A6" stroke-width="3" fill="none"/>
