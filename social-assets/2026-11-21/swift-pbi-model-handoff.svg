<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">A prototype is a handoff, not a finished report</title>
<desc id="desc">A workflow from business questions through grain, dimensions, dates and measure definitions to a model specification with fictional sample rows, validation, a PBIP with a blank report, and an engineering handoff.</desc>
<rect width="1200" height="675" fill="#F6F5F1"/>
<rect x="54" y="48" width="8" height="76" rx="4" fill="#4B75A8"/>
<text x="86" y="82" font-family="Arial, sans-serif" font-size="20" letter-spacing="3" fill="#667384">SWIFT-PBI · PROTOTYPE MODEL</text>
<text x="86" y="142" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#1E2B3A">A prototype is a handoff, not a finished report</text>
<text x="86" y="184" font-family="Arial, sans-serif" font-size="21" fill="#5B6673">The deliverable makes assumptions visible before engineering begins.</text>
