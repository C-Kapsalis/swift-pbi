<text x="64" y="120" font-family="Arial,sans-serif" font-size="42" font-weight="700" fill="#182B38">A generated file is not an accepted design</text>
<rect x="64" y="170" width="330" height="300" rx="20" fill="#FFFFFF" stroke="#9CB5C2" stroke-width="2"/>
