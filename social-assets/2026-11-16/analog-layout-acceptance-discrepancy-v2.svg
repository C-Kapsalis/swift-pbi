<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d">
<title id="t">AnalogLayoutWorld benchmark: GDS output and an internal acceptance-rate discrepancy</title>
<desc id="d">The 12 November arXiv preprint reports 91.1 percent of attempts produced GDS layouts. Its abstract reports 23.0 percent met acceptance criteria, while the introduction reports 21.3 percent. Both figures appear in the same current preprint. The benchmark contains 40 expert-reviewed tasks and 13 model-harness configurations. This is a preprint result, not production-silicon evidence.</desc>
<rect width="1200" height="675" fill="#F5F7F8"/>
