<text x="100" y="330" font-family="Arial,sans-serif" font-size="76" font-weight="700" fill="#245A78">91.1%</text>
<text x="100" y="374" font-family="Arial,sans-serif" font-size="21" fill="#182B38">of attempts produced</text>
<text x="100" y="405" font-family="Arial,sans-serif" font-size="21" fill="#182B38">a GDS layout file</text>
<rect x="430" y="170" width="330" height="300" rx="20" fill="#FFFFFF" stroke="#C9B18E" stroke-width="2"/>
<text x="466" y="224" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#8B5D2E">ABSTRACT</text>
<text x="466" y="330" font-family="Arial,sans-serif" font-size="76" font-weight="700" fill="#8B5D2E">23.0%</text>
<text x="466" y="374" font-family="Arial,sans-serif" font-size="21" fill="#182B38">met all acceptance</text>
<text x="466" y="405" font-family="Arial,sans-serif" font-size="21" fill="#182B38">criteria</text>
<rect x="796" y="170" width="340" height="300" rx="20" fill="#FFFFFF" stroke="#C9B18E" stroke-width="2"/>
<text x="832" y="224" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#8B5D2E">INTRODUCTION</text>
<text x="832" y="330" font-family="Arial,sans-serif" font-size="76" font-weight="700" fill="#8B5D2E">21.3%</text>
<text x="832" y="374" font-family="Arial,sans-serif" font-size="21" fill="#182B38">met all acceptance</text>
<text x="832" y="405" font-family="Arial,sans-serif" font-size="21" fill="#182B38">criteria</text>
<rect x="64" y="500" width="1072" height="72" rx="16" fill="#F6EBDD" stroke="#D5B17C"/>
<text x="96" y="545" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#744B22">The same preprint contains both acceptance figures; the discrepancy is unresolved here.</text>
<text x="64" y="620" font-family="Arial,sans-serif" font-size="17" fill="#667780">40 expert-reviewed tasks · 13 model–harness configurations · preprint, not production-silicon results</text>
